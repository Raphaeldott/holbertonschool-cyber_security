<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="620" fill="#ffffff"/>
  <text x="380" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">Secure by Design: Security at Every Phase</text>
  <text x="380" y="74" text-anchor="middle" font-size="15" fill="#6b7280">A secure software development lifecycle (SDLC)</text>

  <circle cx="380" cy="350" r="170" fill="none" stroke="#e5e7eb" stroke-width="40"/>

  <!-- phase nodes around the ring -->
  <!-- top: Design -->
  <g>
    <circle cx="380" cy="180" r="42" fill="#2c6fbb"/>
    <text x="380" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Design</text>
    <text x="380" y="128" text-anchor="middle" font-size="14" fill="#2c6fbb" font-weight="600">Threat modeling</text>
  </g>
  <!-- right: Build -->
  <g>
    <circle cx="550" cy="300" r="42" fill="#2a9d8f"/>
    <text x="550" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Build</text>
    <text x="628" y="300" text-anchor="middle" font-size="14" fill="#2a9d8f" font-weight="600">Secure coding</text>
  </g>
  <!-- bottom right: Test -->
  <g>
    <circle cx="485" cy="490" r="42" fill="#e9a23b"/>
    <text x="485" y="496" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Test</text>
    <text x="485" y="556" text-anchor="middle" font-size="14" fill="#c27f1f" font-weight="600">SAST / DAST</text>
  </g>
  <!-- bottom left: Deploy -->
  <g>
    <circle cx="275" cy="490" r="42" fill="#6b7fd1"/>
    <text x="275" y="496" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Deploy</text>
    <text x="275" y="556" text-anchor="middle" font-size="14" fill="#4a5bbf" font-weight="600">Secure defaults</text>
  </g>
  <!-- left: Operate -->
  <g>
    <circle cx="210" cy="300" r="42" fill="#5e92cf"/>
    <text x="210" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Operate</text>
    <text x="132" y="300" text-anchor="middle" font-size="14" fill="#2c6fbb" font-weight="600">Monitoring</text>
  </g>

  <!-- directional arrows on ring -->
  <g fill="#9aa5b1">
    <polygon points="470,196 452,188 456,206"/>
    <polygon points="548,406 560,390 530,392"/>
    <polygon points="372,540 390,532 388,548" transform="rotate(8 380 536)"/>
    <polygon points="214,404 196,402 210,418"/>
    <polygon points="206,196 188,206 218,210"/>
  </g>

  <circle cx="380" cy="350" r="92" fill="#f0f6ff" stroke="#cdd9e8"/>
  <text x="380" y="342" text-anchor="middle" font-size="16" font-weight="700" fill="#1e4e8c">Security</text>
  <text x="380" y="366" text-anchor="middle" font-size="16" font-weight="700" fill="#1e4e8c">built in</text>

  <text x="380" y="604" text-anchor="middle" font-size="13" fill="#9aa5b1">Catch flaws in design, when they are cheapest to fix — not in production.</text>
</svg>
