<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>
  <text x="430" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">Least Privilege: Shrinking the Blast Radius</text>

  <!-- divider -->
  <line x1="430" y1="80" x2="430" y2="490" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- LEFT: over-privileged -->
  <text x="215" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#d1495b">Over-Privileged Account</text>
  <circle cx="215" cy="300" r="150" fill="#fbeaed"/>
  <g stroke="#d1495b" stroke-width="2">
    <line x1="215" y1="180" x2="120" y2="240"/>
    <line x1="215" y1="180" x2="310" y2="240"/>
    <line x1="215" y1="180" x2="105" y2="330"/>
    <line x1="215" y1="180" x2="325" y2="330"/>
    <line x1="215" y1="180" x2="160" y2="400"/>
    <line x1="215" y1="180" x2="275" y2="400"/>
  </g>
  <g font-size="12" fill="#7a2230" text-anchor="middle">
    <g><rect x="92" y="226" width="56" height="28" rx="5" fill="#ffffff" stroke="#d1495b"/><text x="120" y="244">DB</text></g>
    <g><rect x="282" y="226" width="56" height="28" rx="5" fill="#ffffff" stroke="#d1495b"/><text x="310" y="244">Billing</text></g>
    <g><rect x="77" y="316" width="56" height="28" rx="5" fill="#ffffff" stroke="#d1495b"/><text x="105" y="334">Prod</text></g>
    <g><rect x="297" y="316" width="56" height="28" rx="5" fill="#ffffff" stroke="#d1495b"/><text x="325" y="334">Secrets</text></g>
    <g><rect x="132" y="386" width="56" height="28" rx="5" fill="#ffffff" stroke="#d1495b"/><text x="160" y="404">Logs</text></g>
    <g><rect x="247" y="386" width="56" height="28" rx="5" fill="#ffffff" stroke="#d1495b"/><text x="275" y="404">Email</text></g>
  </g>
  <circle cx="215" cy="180" r="26" fill="#d1495b"/>
  <text x="215" y="186" text-anchor="middle" font-size="22" fill="#ffffff">&#128100;</text>
  <text x="215" y="478" text-anchor="middle" font-size="13" fill="#b03a4c">One compromise &#8594; everything is exposed</text>

  <!-- RIGHT: least privilege -->
  <text x="645" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#2a9d8f">Least-Privilege Account</text>
  <circle cx="645" cy="300" r="150" fill="#ffffff"/>
  <circle cx="645" cy="300" r="70" fill="#e8f5f2"/>
  <line x1="645" y1="206" x2="645" y2="286" stroke="#2a9d8f" stroke-width="2"/>
  <g font-size="12" fill="#1f6b60" text-anchor="middle">
    <rect x="612" y="286" width="66" height="28" rx="5" fill="#ffffff" stroke="#2a9d8f"/><text x="645" y="304">DB (read)</text>
  </g>
  <g opacity="0.35" font-size="12" fill="#9aa5b1" text-anchor="middle">
    <rect x="512" y="226" width="56" height="26" rx="5" fill="#f3f4f6" stroke="#cbd5e1"/><text x="540" y="243">Billing</text>
    <rect x="722" y="226" width="56" height="26" rx="5" fill="#f3f4f6" stroke="#cbd5e1"/><text x="750" y="243">Secrets</text>
    <rect x="512" y="350" width="56" height="26" rx="5" fill="#f3f4f6" stroke="#cbd5e1"/><text x="540" y="367">Prod</text>
    <rect x="722" y="350" width="56" height="26" rx="5" fill="#f3f4f6" stroke="#cbd5e1"/><text x="750" y="367">Email</text>
  </g>
  <circle cx="645" cy="180" r="26" fill="#2a9d8f"/>
  <text x="645" y="186" text-anchor="middle" font-size="22" fill="#ffffff">&#128100;</text>
  <text x="645" y="478" text-anchor="middle" font-size="13" fill="#1f6b60">One compromise &#8594; damage stays contained</text>
</svg>
