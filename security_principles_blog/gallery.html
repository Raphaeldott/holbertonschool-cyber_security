<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Blog — Diagrams</title>
<style>
  body { margin:0; background:#f3f4f6; font-family:Segoe UI, Arial, sans-serif; color:#1f2937; }
  header { padding:20px 16px; text-align:center; }
  h1 { margin:0; font-size:22px; }
  p.sub { margin:6px 0 0; color:#6b7280; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:18px; padding:16px; max-width:1200px; margin:0 auto; }
  figure { margin:0; background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
  figcaption { font-size:13px; color:#6b7280; margin-top:8px; text-align:center; }
  img { width:100%; height:auto; display:block; }
</style>
</head>
<body>
<header>
  <h1>Security Principles — Blog Diagrams</h1>
  <p class="sub">The six SVGs embedded in the Medium article</p>
</header>
<div class="grid">
  <figure><img src="01-defense-in-depth.svg" alt="Defense in Depth"><figcaption>01 — Defense in Depth</figcaption></figure>
  <figure><img src="02-least-privilege.svg" alt="Least Privilege"><figcaption>02 — Least Privilege</figcaption></figure>
  <figure><img src="03-separation-of-duties.svg" alt="Separation of Duties"><figcaption>03 — Separation of Duties</figcaption></figure>
  <figure><img src="04-secure-by-design.svg" alt="Secure by Design"><figcaption>04 — Secure by Design</figcaption></figure>
  <figure><img src="05-security-obscurity.svg" alt="Security Through Obscurity"><figcaption>05 — Security Through Obscurity</figcaption></figure>
  <figure><img src="06-synthesis.svg" alt="Synthesis"><figcaption>06 — Synthesis</figcaption></figure>
</div>
</body>
</html>
