<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="540" fill="#ffffff"/>
  <text x="380" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">Security Through Obscurity</text>
  <text x="380" y="74" text-anchor="middle" font-size="15" fill="#6b7280">A thin outer layer — never the foundation</text>

  <g transform="translate(380,300)">
    <!-- obscurity: thin dashed outer shell -->
    <circle r="190" fill="#fdf3e3" stroke="#e9a23b" stroke-width="2" stroke-dasharray="7 7"/>
    <!-- real controls core -->
    <circle r="140" fill="#e8f5f2" stroke="#2a9d8f" stroke-width="2"/>
    <circle r="70" fill="#2a9d8f"/>

    <text y="-156" text-anchor="middle" font-size="15" font-weight="700" fill="#c27f1f">Obscurity (hide ports, versions)</text>
    <text y="-108" text-anchor="middle" font-size="14" fill="#1f6b60" font-weight="600">Real controls</text>

    <text y="-30" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">Encryption</text>
    <text y="-8"  text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">Authentication</text>
    <text y="14"  text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">Access control</text>
    <text y="36"  text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">Patching</text>
  </g>

  <!-- Kerckhoffs test callout -->
  <rect x="150" y="470" width="460" height="46" rx="10" fill="#f3f4f6" stroke="#cbd5e1"/>
  <text x="380" y="492" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">The test (Kerckhoffs's principle):</text>
  <text x="380" y="510" text-anchor="middle" font-size="13" fill="#6b7280">If every detail were published tomorrow, would the system still be secure?</text>
</svg>
